[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-baramundi"
version = "0.1.4"
description = "NetBox plugin integrating baramundi Management Suite via bConnect API v2: endpoint mapping for devices and VMs, endpoint panel, client for other plugins (e.g. netbox-patch-management)."
authors = [{ name = "Carsten Viell" }]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["requests>=2.32.0"]

[project.urls]
Homepage = "https://github.com/carstenviell/netbox-baramundi"
Repository = "https://github.com/carstenviell/netbox-baramundi"

[tool.setuptools.packages.find]
where = ["."]
include = ["netbox_baramundi*"]

[tool.setuptools.package-data]
"netbox_baramundi" = ["templates/**/*", "locale/**/*"]

[tool.setuptools]
include-package-data = true
